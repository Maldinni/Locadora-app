# Nginx — proxy reverso para o Gunicorn (Loca Fácil).
# Copie para /etc/nginx/sites-available/locafacil e ative:
#
#   sudo cp deploy/nginx-locafacil.conf /etc/nginx/sites-available/locafacil
#   sudo ln -s /etc/nginx/sites-available/locafacil /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Os arquivos estáticos são servidos pelo WhiteNoise (dentro do Gunicorn),
# então não há bloco "location /static/" aqui — é proposital.

server {
    listen 80;
    # Troque pelo IP do VPS agora; depois pelo seu domínio (ex.: locafacil.com.br).
    server_name SEU_IP_OU_DOMINIO;

    # Permite upload/geração de arquivos um pouco maiores (contratos etc.).
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Informa ao Django o esquema original (necessário quando houver HTTPS).
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
