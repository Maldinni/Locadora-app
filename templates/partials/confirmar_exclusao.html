{% comment %}Card de confirmação. Params: titulo, descricao, cancelar_url.{% endcomment %}
{% load locadora_extras %}
<div class="page" style="max-width: 520px;">
  <div class="card card--pad">
    <div class="stat__icon stat__icon--danger" style="margin-bottom: 16px;">{% icon "alert" 22 %}</div>
    <h1 class="page-title" style="font-size: 21px;">{{ titulo }}</h1>
    <p class="page-sub">{{ descricao }}</p>
    <p class="subtle" style="font-size: 13px; margin-top: 6px;">Esta ação não pode ser desfeita.</p>

    <form method="post" class="form-actions">
      {% csrf_token %}
      <a href="{{ cancelar_url }}" class="btn btn--secondary btn--md">Cancelar</a>
      <button type="submit" class="btn btn--danger btn--md">{% icon "trash" 16 %} Excluir</button>
    </form>
  </div>
</div>
