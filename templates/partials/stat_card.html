{% comment %}Card de estatística. Params: label, valor, tone, icon, foot (opcional).{% endcomment %}
{% load locadora_extras %}
<div class="card card--pad stat">
  <div class="stat__top">
    <div class="stat__icon stat__icon--{{ tone|default:'primary' }}">{% icon icon 20 %}</div>
  </div>
  <div class="stat__value">{{ valor }}</div>
  <div class="stat__label">{{ label }}</div>
  {% if foot %}<div class="stat__foot">{{ foot }}</div>{% endif %}
</div>
