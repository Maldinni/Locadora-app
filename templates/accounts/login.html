{% load static %}
<!DOCTYPE html>
<html lang="pt-br" class="h-full bg-gray-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Locadora</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-full items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="mb-6 flex flex-col items-center gap-2 text-blue-700">
      <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-6m6 0V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v9.375" /></svg>
      <h1 class="text-2xl font-bold text-gray-800">Locadora</h1>
      <p class="text-sm text-gray-500">Acesse sua conta</p>
    </div>

    <form method="post" class="rounded-xl bg-white p-8 shadow-md">
      {% csrf_token %}
      {% if form.non_field_errors %}
      <div class="mb-4 rounded-md bg-red-50 p-3 text-sm text-red-700">
        {{ form.non_field_errors|join:" " }}
      </div>
      {% endif %}

      <div class="mb-4">
        <label class="mb-1 block text-sm font-medium text-gray-700" for="{{ form.username.id_for_label }}">Usuário</label>
        {{ form.username }}
      </div>
      <div class="mb-6">
        <label class="mb-1 block text-sm font-medium text-gray-700" for="{{ form.password.id_for_label }}">Senha</label>
        {{ form.password }}
      </div>

      <button type="submit" class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">
        Entrar
      </button>
    </form>
  </div>
</body>
</html>
