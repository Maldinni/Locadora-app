{% load static locadora_extras %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Loca Fácil</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("locadora-theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>
  <div class="auth">
    <div class="auth__box">
      <div class="auth__brand">
        <span class="auth__mark"><img src="{% static 'img/logo.jpg' %}" alt="Loca Fácil" class="auth__logo"></span>
        <h1 class="auth__title">Loca Fácil</h1>
        <p class="auth__sub">Acesse sua conta</p>
      </div>

      <form method="post" class="card auth__card">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="form-error-summary">{{ form.non_field_errors|join:" " }}</div>
        {% endif %}

        <div class="auth__field">
          <label class="field-label" for="{{ form.username.id_for_label }}">Usuário</label>
          {{ form.username }}
        </div>
        <div class="auth__field">
          <label class="field-label" for="{{ form.password.id_for_label }}">Senha</label>
          {{ form.password }}
        </div>

        <button type="submit" class="btn btn--primary btn--md" style="width: 100%; justify-content: center; margin-top: 4px;">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
