{% extends "base.html" %}
{% block title %}Trocar senha · Locadora{% endblock %}
{% block page_title %}Minha conta{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
  <h1 class="mb-6 text-2xl font-semibold text-gray-800">Trocar senha</h1>
  <form method="post" class="rounded-lg bg-white p-6 shadow">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="mt-6 flex justify-end gap-3">
      <a href="{% url 'dashboard' %}" class="rounded-md border border-gray-300 px-4 py-2 text-sm text-gray-600 hover:bg-gray-50">Cancelar</a>
      <button type="submit" class="rounded-md bg-blue-600 px-5 py-2 text-sm font-semibold text-white hover:bg-blue-700">Alterar senha</button>
    </div>
  </form>
</div>
{% endblock %}
