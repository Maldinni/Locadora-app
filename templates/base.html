{% load static %}
<!DOCTYPE html>
<html lang="pt-br" class="h-full bg-gray-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Locadora{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  <script>
    // Garante o token CSRF em todas as requisições HTMX.
    document.body && document.body.addEventListener('htmx:configRequest', () => {});
  </script>
</head>
<body class="h-full" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
<div x-data="{ sidebarOpen: false }" class="min-h-full">

  {% include "partials/sidebar.html" %}

  <!-- Conteúdo -->
  <div class="lg:pl-64 flex flex-col min-h-screen">
    {% include "partials/topbar.html" %}

    <main class="flex-1 py-6">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer class="py-4 text-center text-xs text-gray-400">
      Locadora · MVP de gestão de frota
    </footer>
  </div>

  {% include "partials/toasts.html" %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
